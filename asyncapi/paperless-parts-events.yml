asyncapi_spec: null
webhooks: false
event_surface: poll
summary: >-
  Paperless Parts has a real, first-class event surface — the "Streaming API" — but it is NOT
  webhooks and NOT AsyncAPI. It is a poll-based event feed exposed as two ordinary REST operations
  in the v1 OpenAPI, and the platform never calls out to a subscriber URL. There is no callback
  registration endpoint, no webhook secret, no signature header, no delivery-retry semantics and no
  `webhooks:` block in either published spec. Any integration reacting to Paperless Parts events
  must run a poller (or the first-party Python SDK's listener loop, which is a poller with a nicer
  interface). No AsyncAPI document is published, and none is authored here.
note: >-
  Because the surface is neither an AsyncAPI document nor a webhook catalog, no `AsyncAPI` and no
  `Webhooks` pointer is wired into apis.yml. Emitting `Webhooks` would assert a push surface
  Paperless Parts does not operate.
transport:
  style: HTTP long-poll / repeated GET
  authentication: same account API token as the rest of the REST API
  ordering: not documented
  at_least_once: >-
    Implied — an event stays in the poll response until a dispatch record is created for it, which
    is what `create_dispatch_records=true` does. Re-delivery on failure is the consumer's problem.
  poll_interval: NOT DOCUMENTED — no recommended or maximum poll rate is published anywhere
operations:
  - operationId: ListEvents
    method: GET
    path: /events/public
    version: v1
    summary: Returns a list of events
    description: Returns a list of events. Use the ID provided from the event to create integration actions.
    parameters:
      - name: event_type_in
        in: query
        description: Filter to return events of a specified event type
      - name: was_dispatched
        in: query
        description: Filter to return only events that have associated dispatch records
    response: array of Event
  - operationId: PollEvents
    method: GET
    path: /managed_integrations/public/{managed_integration_uuid}/poll
    version: v1
    summary: Returns a list of new events
    description: Returns a list of events that have not yet been dispatched for the managed integration.
    parameters:
      - name: managed_integration_uuid
        in: path
        description: The unique identifier for the managed integration whose events you want to poll
      - name: create_dispatch_records
        in: query
        description: >-
          Whether you would like to create associated dispatch records for all events returned for
          this page. If set to true (or left unspecified), the events returned will not show up in
          the next response from this endpoint.
      - name: event_type_in
        in: query
      - name: was_dispatched
        in: query
    response: array of Event
event_schema:
