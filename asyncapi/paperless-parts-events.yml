docs_note: >-
  The two help.paperlessparts.com articles returned HTTP 200 but are Salesforce Experience Cloud
  pages that render client-side; an unauthenticated crawler receives a shell with a "CSS Error"
  loader and no article body, so their content could not be read in this pass. Everything above is
  taken from the OpenAPI and the SDK repository instead.
gaps:
  - no AsyncAPI document
  - no webhook / push delivery, only polling
  - no published event-type vocabulary
  - no published poll interval or rate ceiling
  - the event surface exists only in v1; v2 does not carry it
