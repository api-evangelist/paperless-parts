event_types:
  documented_in_spec:
    - id: integration_action.requested
      source: the `type` field's example value in the Event schema
  note: >-
    The full event-type vocabulary is NOT published. The OpenAPI carries exactly one example value
    and the `event_type_in` filter takes an unconstrained string, so a consumer cannot enumerate
    what events exist without either reading the Salesforce-hosted help article or observing live
    traffic. The first-party SDK ships OrderListener and QuoteListener, which implies order- and
    quote-creation events exist, but their type strings are not published in any machine-readable
    artifact.
supporting_surface:
  managed_integrations:
    note: >-
      Events are scoped to a "managed integration", registered and heartbeated through the v1
      Integration Actions endpoints.
    operations:
