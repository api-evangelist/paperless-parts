apis:
- name: Paperless Parts API v2
  description: >-
    Version 2 of the Paperless Parts REST API — 101 operations across 58 paths covering Quotes
    (headers, items, operations, add-ons, discounts, pricing items, files), Orders, Jobs and job
    operations, Parts (geometric, manual, assemblies, flat-pattern DXF), Processes and operation /
    add-on / discount definitions, Contacts, Accounts, facilities, billing addresses, payment terms
    and users, Custom Tables and Purchased Components. Authorized with an account API token in the
    Authorization header.
  humanURL: https://docs.paperlessparts.com/v2
  baseURL: https://api.paperlessparts.com/v2
