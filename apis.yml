aid: paperless-parts
name: Paperless Parts
description: >-
  Paperless Parts, Inc. is a Boston-based manufacturing software company founded in 2017 that
  builds a secure, ITAR-compliant cloud quoting and sales platform for custom part manufacturers —
  job shops, contract manufacturers and rapid-prototype businesses working in CNC machining, sheet
  metal fabrication, Swiss screw machining, wire EDM, waterjet and additive manufacturing. A
  patented geometry engine analyses uploaded CAD to automate costing, and the P3L pricing language
  lets a shop encode its own pricing logic. The company publishes a public REST API in two live
  versions (v1 and v2) at api.paperlessparts.com, covering quotes, quote items, orders, jobs, parts,
  processes, contacts and accounts, custom pricing tables, purchased components, and a managed
  integrations framework with a poll-based Streaming API for reacting to platform events. A
  first-party Python SDK is published on GitHub under the part-os organization.
