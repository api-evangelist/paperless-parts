- name: Paperless Parts API v1
  description: >-
    Version 1 of the Paperless Parts REST API — 54 operations across 33 paths covering Quotes,
    Quote Items, Orders, Customers (contacts, accounts, facilities, billing addresses, payment
    terms), Custom Tables, Purchased Components, Integration Actions / managed integrations, and
