      operationId: ListPaymentTerms
      tags:
      - Contacts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTerms'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Payment terms not found
                type: string
                example: 'Error: Not Found'
    post:
      summary: Create payment terms
      operationId: CreatePaymentTerms
      tags:
      - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Label for Payment Terms
                  example: Net 30 days
                period:
                  type: integer
                  description: Days until payment is due
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTerms'
  /customers/public/payment_terms/{paymentTermsId}:
    get:
      summary: Get details about a payment terms
      description: Get all payment terms attributes, including a list of billing addresses.
      operationId: PaymentTermsDetails
      parameters:
      - $ref: '#/components/parameters/paymentTermsId'
      tags:
      - Contacts
      responses:
        200:
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerms'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Payment terms not found
                type: string
                example: 'Error: Not Found'
    patch:
      summary: Update an Payment terms
      description: Partially update payment terms attributes
      operationId: UpdatePaymentTerms
      parameters:
      - $ref: '#/components/parameters/paymentTermsId'
      tags:
      - Contacts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerms'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type:
                  - string
                  - 'null'
                  description: Label for Payment Terms
                  example: Net 30 days
                period:
                  type:
                  - integer
                  - 'null'
                  description: Days until payment is due
    delete:
      summary: Delete payment terms
