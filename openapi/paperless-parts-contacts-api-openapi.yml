  /users/public:
    get:
      summary: Returns a list of users for the user group
      operationId: ListUsers
      tags:
      - Contacts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Users not found
