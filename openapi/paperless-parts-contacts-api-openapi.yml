components:
  schemas:
    BillingAddressId:
      type: integer
      description: The billing address id
      example: '27'
    PaymentTerms:
      type: object
      properties:
        id:
          type: integer
          example: 26198
          description: the ID of the payment terms
        label:
          type: string
          example: Net 30 days
          description: the label for the payment terms
        period:
          type: integer
          example: 30
          description: number of days before payment is due
    UserUuid:
      type: string
      description: The user uuid
      example: 37d984ea-ec42-4a00-9cd1-a4cc73bb721e
    Contact:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        account_id:
          type:
          - integer
          - 'null'
          example: 17
          description: The ID of the associated account
        created:
          type: string
          readOnly: true
          example: '2020-08-25T18:00:53+00:00'
        email:
          type: string
          example: careers@paperlessparts.com
          description: (Required) email address (must be non-null, unique across all Customers, and a valid email format)
        first_name:
          type: string
          example: Gordon
          description: (Required) Customer first name (must be non-null)
        id:
          type: integer
          example: 137
          readOnly: true
        last_name:
          type: string
          example: Moore
          description: (Required) Customer last name (must be non-null)
        notes:
          type:
          - string
          - 'null'
          description: Customer notes
        phone:
          type:
          - string
          - 'null'
          example: '6176354500'
          description: Customer phone number
        phone_ext:
          type:
          - string
          - 'null'
          example: null
          description: Customer phone number extension
        salesperson:
          $ref: '#/components/schemas/SalesPerson'
        metadata:
          $ref: '#/components/schemas/Metadata'
    SalesPerson:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        erp_code:
          type: string
    Metadata:
      type: object
      example: '{ crm_id: 1581 }'
      description: Object that can be used to attach key-value data to an object. Up to 25 keys can be speficied, with key names up to 40 characters long and values up to 500 characters long.
    CustomerId:
      type: integer
      description: The customer id
      example: '32'
    AccountId:
      type: integer
      description: The account id
      example: '13'
    PaymentTermsId:
      type: integer
      description: The payment terms id
      example: '1234'
    AddressInfo:
      type:
      - object
      - 'null'
      properties:
        id:
          type: integer
          example: 55123
        address1:
          type: string
          example: 1 City Hall Sq.
        address2:
          type:
          - string
          - 'null'
          example: null
        attention:
          type: string
          example: Gordon Moore
        business_name:
          type: string
          example: Paperless Parts, Inc.
        city:
          type: string
          example: Boston
        country:
          type: string
          example: USA
        facility_name:
          type:
          - string
          - 'null'
          example: Boston Office
        phone:
          type: string
          example: '6176354500'
        phone_ext:
          type:
          - string
          - 'null'
          example: null
        postal_code:
          type: string
          example: 1153
        state:
          type: string
          example: MA
    Address:
      type: object
      properties:
        address1:
          type: string
          maxLength: 250
          example: 1 City Hall Sq.
          description: (Required)
        address2:
          type:
          - string
          - 'null'
          maxLength: 250
          example: null
          description: (Required)
        city:
          type: string
          maxLength: 100
          example: Boston
          description: (Required)
        state:
          type: string
          description: (Required) State/Province must be specified as standard postal abbreviation
          example: MA
        postal_code:
          type: string
          example: '02114'
          description: (Required) US postal codes may optionally contain 4-digit extension, e.g., `'02114-1234'`
        country:
          type: string
          maxLength: 3
          description: (Required) Country must be ISO 3166-1 alpha-3 code. Currently allowed values are `'USA'`, `'CAN'`.
          example: USA
        erp_code:
          type: string
          maxLength: 50
          description: The unique identifier for this address record in the ERP
          example: B1234
    User:
      type: object
      properties:
        uuid:
          type: string
          example: 37d984ea-ec42-4a00-9cd1-a4cc73bb721e
          description: the uuid (unique identifier) for the user
        email:
          type: string
          example: careers@paperlessparts.com
          description: the email address of the user
        first_name:
          type: string
          example: Gordon
          description: User first name (must be non-null)
        last_name:
          type: string
          example: Moore
          description: User last name (must be non-null)
        erp_code:
          type: string
          example: EMPLOYEE1
          description: ERP code for the user
    FacilityId:
      type: integer
      description: The facility id
      example: '30'
    Facility:
      type:
      - object
      - 'null'
      properties:
        account_id:
          type: integer
          example: 55123
        address:
          $ref: '#/components/schemas/Address'
        attention:
          type: string
          example: Gordon Moore
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Boston Office
        salesperson:
          $ref: '#/components/schemas/SalesPerson'
    Account:
      type: object
      properties:
        billing_address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        name:
          type: string
          example: Paperless Parts, Inc.
          description: (Required) The name of the account
        created:
          type: string
          readOnly: true
          example: '2020-08-25T18:00:53+00:00'
        credit_cards_enabled:
          type: boolean
          example: true
          description: When `true` any contact associated with this account will be allowed to check out with a credit card.
        credit_line:
          type:
          - number
          - 'null'
          description: credit line (dollars)
          example: 10000.0
        erp_code:
          type:
          - string
          - 'null'
          example: PPI
          description: The ERP code of the account
        id:
          type: integer
          readOnly: true
          example: 17
          description: the ID of the account
        notes:
          type:
          - string
          - 'null'
          description: Account notes
        payment_terms:
          type:
          - string
          - 'null'
          example: Net 30
          description: Payment terms; required if `payment_terms_period` are included
        payment_terms_period:
          type:
          - integer
          - 'null'
          example: 30
          description: Payment terms period in days; required if `payment_terms` are included, but can be `null`
        phone:
          type:
          - string
          - 'null'
          example: '6176354500'
          description: Account phone number
        phone_ext:
          type:
          - string
          - 'null'
          example: null
          description: Account phone number extension
        purchase_orders_enabled:
          type: boolean
          example: true
          description: When `true` this account can check out with a purchase order
        salesperson:
          $ref: '#/components/schemas/SalesPerson'
        sold_to_address:
          $ref: '#/components/schemas/Address'
        tax_exempt:
          type: boolean
          example: true
          description: When `true`, sales tax will not be added to a quote
        tax_rate:
          type:
          - number
          - 'null'
          example: 6.25
          description: Sales tax rate for this account
        type:
          type: string
          example: customer
          description: Type of account, either customer or vendor
        url:
          type:
          - string
          - 'null'
          example: https://www.paperlessparts.com
        metadata:
          $ref: '#/components/schemas/Metadata'
  parameters:
    billingAddressId:
      name: billingAddressId
      in: path
      required: true
      example: 27
      schema:
        $ref: '#/components/schemas/BillingAddressId'
    contactId:
      name: contactId
      in: path
      description: The integer idenfier of a Contact, assigned automatically by Paperless Parts
      required: true
      schema:
        $ref: '#/components/schemas/CustomerId'
    userUuid:
      name: userUuid
      in: path
      required: true
      example: 37d984ea-ec42-4a00-9cd1-a4cc73bb721e
      schema:
        $ref: '#/components/schemas/UserUuid'
    paymentTermsId:
      name: paymentTermsId
      in: path
      required: true
      example: 1234
      schema:
        $ref: '#/components/schemas/PaymentTermsId'
    facilityId:
      name: facilityId
      in: path
      required: true
      example: 30
      schema:
        $ref: '#/components/schemas/FacilityId'
    accountId:
      name: accountId
      in: path
      required: true
      example: 17
      schema:
        $ref: '#/components/schemas/AccountId'
  securitySchemes:
    app_id:
      type: apiKey
      description: API key to authorize requests.
      name: Authorization
      in: header
