openapi: "3.0.2"

info:
  title: "Paperless Parts API v2"
  description: |2-
    The Paperless Parts API provides access to your data, enabling developers to easily integrate Paperless Parts with third-party systems, such as Customer Relationship Management (CRM) and Enterprise Resource Planning (ERP) tools. The API is designed to support two primary use case. First, reading all information associated with a particular order or quote for import into another system. Second, managing customer data, either for an initial bulk import or for on-going synchronization with an external database.

    ## Authorization ##

    Requests are authorized via an API key. Administrators of a Paperless Parts account can generate an API Token which grants access to all of the endpoints documented here. The token obtained from the application must be added to the header of all requests using the key `\"Authorization\"` with the value `\"API-Token <api_token>\"`, where `<api_token>` is your Paperless Parts API Token.


    You can use the \"Execute\" button in an endpoint's documentation on this page to try out the endpoint. This will send a request to the endpoint on the Paperless Parts server and display the result on this page. Before doing so, however, you'll need to click on the 'Authorize' button at the top of the screen, and in the \"Value\" field enter `\"API-Token <api_token>\"`, where `<api_token>` is your API token as described above.


    ## Overview ##

    The API endpoints are organized around REST. API calls should be made to the `https://api.paperlessparts.com` base domain. URLs are designed to clearly describe an entity or collection of entities. HTTP verbs typically describe whether entities are being read, created, modified, or deleted. Where applicable, request and response bodies are in JSON format. Standard HTTP response codes, in addition to error messages, are used to help explain request failures.

    ### Associations

    Many entities in the API data model are associated with other entities. As a guiding principle, `GET` requests that fetch data nest associated entities in the JSON response. However, when creating or modifying entities, a flat (non-nested) object must be provided, as explained in the documentation for each endpoint. Associations are specified when writing data by using entity IDs in fields ending in `_id`.


    For example, consider the relationship where a Company has many Customers. When fetching a Customer via a `GET` request, the associated Company will be nested as an object with key `company` in the response. When creating a Customer, the Company is specified via its integer id using the key `company_id`.

    ### Events Overview

    Events are a way of logging relevant actions that are taken within your account. For instance, when you create a new quote, Paperless Parts logs a `quote.created` event, and once you send that quote, we log another `quote.sent` event.


    These logs offer you a trail of data that you can use to keep integrations in sync. By polling for new events, you can maintain an up-to-date record of what actions Paperless Parts has initiated that your integration has not. For instance, you could poll for `part.interrogation_succeeded` events and send out a notification upon receiving one.

    ### HTTP Methods

    The API endpoints support different HTTP methods depending on whether records are being read, created, or updated. To read an entity, use `GET`. To create a new entity, use `POST`. To modifying an entity, use `PATCH`. Note, `PATCH` is used rather than `PUT` to indicate that entities can be partially updated. In other words, in general, if a field is omitted from a `PATCH` request, that field's value will stay the same (rather than be set to `null`). All fields requiring values are required to be included in `POST` requests.

    > Note: Endpoints with a documented `PATCH` method can generally be used with a `PUT` method. The `PUT` is implemented as a partial update (as opposed to a replacement) and is supported for maximum compatibilty.


    For example, consider the `email` field on the Customer entity, which is required. All Customers must have a non-null `email`. When creating a Customer via `POST`, the request body must contain an `email` key and its value cannot be `null` (other validation applies to that field, as well, including a valid email format and a unique value). When editing a Customer via `PATCH` request, it is not necessary to include an `email` key in the request body. If `email` is omitted, the existing email address will not be changed. If you send a `PATCH` request with `email=null`, then you will receive an error response indicating that a value for `email` is required.
  version: "2.0"
  termsOfService: "https://www.paperlessparts.com/web-service-agreement/"
  contact:
    name: "Paperless Parts"
    url: "https://www.paperlessparts.com"
    email: "support@paperlessparts.com"

security:
  - app_id: []

servers:
  - url: "{url}/{version}"
    variables:
      url:
        default: "https://api.paperlessparts.com"
      version:
        default: "v2"

tags:
  - name: Orders
    description: Endpoints for identifying newly placed orders and pulling all information related to a particular order. Also, a new order can be created via open API to turn an existing quote into order.
  - name: Quotes
    description: Endpoints for identifying newly sent quotes, pulling all information related to a particular quote, and updating a quote's status.
  - name: Contacts
    description: "
Paperless Parts includes Customer Relationship Management (CRM) functionality to make it easy to send quotes to new and existing customers, while keeping data consistent with third-party CRM and ERP systems. Typical use cases for these endpoints are to bulk import customers from an existing customer database and to synchronize new customers or changes from another system.


An account represents a single company or account to which you would send quotes. An account has zero or more Contacts, each of which represents a person at that company and is identified uniquely by their email address. An account also has facilities and billing addresses. Facilities represent destinations to which orders can be shipped and BillingAddresses represent the bill to address for and order."
  - name: Custom Tables
    description: Endpoints for managing custom tables used by Operations to compute pricing.
  - name: Purchased Components
    description: Endpoints for managing purchased components and purchased components columns.
  - name: Jobs
    description: Endpoints for managing Jobs
  - name: Parts
    description: Endpoints for managing Parts
  - name: Processes
    description: Endpoints for managing Processes, Operation Definitions, and Add on Definitions
  - name: Quote Items
    description: Endpoints for creating and managing line items on a quote.
paths:
  /quotes/public:
    post:
      summary: "Create a new quote"
      description: "Creates a new quote object"
      operationId: CreateQuote
      tags:
        - Quotes
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_id:
                  type: integer
                  nullable: true
                  description: The ID of the associated Contact
                metadata:
                  $ref: '#/components/schemas/Metadata'
                manual_rfq_received_date:
                  type: string
                  format: date-time
                rfq_number:
                  type: string
                  nullable: true
                expired_date:
                  type: string
                  format: date-time
                estimator:
                  type: string
                  nullable: true
                  example: 335c5770-8cd4-46d3-98a1-7c0e12251124
                  description: The uuid for the estimator assigned to this quote
                salesperson:
                  type: string
                  nullable: true
                  example: 335c5770-8cd4-46d3-98a1-7c0e12251124
                  description: The uuid for the salesperson assigned to this quote
                due_date:
                  type: string
                  format: date-time
                  nullable: true
                  description: The due date of the quote
                private_notes:
                  type: string
                  nullable: true
                  description: Internal notes regarding the quote
                quote_notes:
                  type: string
                  nullable: true
                  description: Customer-facing notes regarding the quote
                erp_code:
                  type: string
                  nullable: true
                tax_rate:
                  type: number
                  format: float
                priority:
                  type: integer

    get:
      summary: "List quote headers"
      operationId: ListQuoteHeaders
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: The total number of records matching the supplied query parameters
                  next:
                    type: string
                    description: The URL of the next page of results. Null if this is the last page
                    nullable: true
                  previous:
                    type: string
                    description: The URL of the previous page of results. Null if this is the first page
                    nullable: true
                  results:
                    $ref: '#/components/schemas/QuoteHeader'

  /quotes/public/header/{quoteUuid}:
    get:
      summary: "Get the details for a quote header"
      operationId: 'GetQuoteHeaderDetails'
      tags:
        - Quotes
      parameters:
        - $ref: '#/components/parameters/quoteUuid'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteHeader'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Order not found
                type: string
                example: "Error: Not Found"

    patch:
      summary: "Update the details for a quote header"
      operationId: 'UpdateQuoteHeaderDetails'
      tags:
        - Quotes
      parameters:
        - $ref: '#/components/parameters/quoteUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                erp_code:
                  type: string
                  nullable: true
                metadata:
                  $ref: '#/components/schemas/Metadata'
                manual_rfq_received_date:
                  type: string
                  format: date-time
                rfq_number:
                  type: string
                  nullable: true
                expired_date:
                  type: string
                  format: date-time
                status:
                  type: string
                  nullable: true
                  description: the status of the quote. Available statuses are "oustanding", "cancelled", "lost", and "trash"
                  example: "outstanding"
                estimator:
                  type: string
                  nullable: true
                  example: 335c5770-8cd4-46d3-98a1-7c0e12251124
                  description: The uuid for the estimator assigned to this quote
                salesperson:
                  type: string
                  nullable: true
                  example: 335c5770-8cd4-46d3-98a1-7c0e12251124
                  description: The uuid for the salesperson assigned to this quote
                due_date:
                  type: string
                  format: date-time
                  nullable: true
                  description: The due date of the quote
                private_notes:
                  type: string
                  nullable: true
                  description: Internal notes regarding the quote
                quote_notes:
                  type: string
                  nullable: true
                  description: Customer-facing notes regarding the quote
                tax_rate:
                  type: number
                  format: float
                priority:
                  type: integer

      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteHeader'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Order not found
                type: string
                example: "Error: Not Found"


  /quotes/public/new:
    get:
      summary: "List new quote numbers and revisions"
      description: "List the numbers and revisions of new quotes that have been sent. If the number and (optional) revision of the last known sent quote is supplied, this endpoint will return a list of the numbers and revisions of the quotes sent after the specified quote. If no number is provided, this endpoint will return a list of the numbers and revisions of all sent quotes. Note that the quote numbers will be returned in the order the quotes were sent, not necessarily in ascending numerical order."
      operationId: 'NewQuoteNumbers'
      parameters:
        - $ref: '#/components/parameters/last_quote'
        - $ref: '#/components/parameters/revision'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteNumberArray'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"

  /quotes/public/{quoteNumber}:
    get:
      summary: "Get quote details"
      description: "Get the details for a specific quote."
      operationId: 'QuoteDetails'
      parameters:
        - $ref: '#/components/parameters/quoteNumber'
        - $ref: '#/components/parameters/revisionNumber'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"

  /quotes/public/{quoteNumber}/status_change:
    patch:
      summary: "Update a quote's status"
      description: "Update a specific quote's status."
      operationId: 'SetQuoteStatus'
      parameters:
        - $ref: '#/components/parameters/quoteNumber'
        - $ref: '#/components/parameters/revisionNumber'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  description: the status of the quote. Available statuses are "oustanding", "cancelled", "lost", and "trash"
                  example: "outstanding"
  
  /quotes/public/items:
    post:
      summary: "Create a new quote item"
      description: "Attach a new QuoteItem to a Quote"
      operationId: "CreateQuoteItem"
      tags:
        - Quotes
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLine'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quote:
                  type: string
                  description: The UUID of the quote to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                material:
                  type: string
                  description: The UUID of the material to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                part:
                  type: string
                  description: The UUID of the part to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                process:
                  type: string
                  description: The UUID of the process to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                quantities:
                  type: array
                  description: Array of the requested quantities
                  items:
                    type: integer
                  example: [1, 5, 10]
                public_notes:
                  type: string
                private_notes:
                  type: string
                metadata:
                  $ref: '#/components/schemas/Metadata'

  /quotes/public/items/{quoteItemUuid}:
    patch:
      summary: Update fields on a QuoteItem.
      description: Update field on a QuoteItem.
      operationId: 'updateQuoteItem'
      parameters:
        - $ref: '#/components/parameters/quoteItemUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLine'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                material:
                  type: string
                  description: The UUID of the material to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                process:
                  type: string
                  description: The UUID of the process to tie the quote item to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                public_notes:
                  type: string
                private_notes:
                  type: string
                metadata:
                  $ref: '#/components/schemas/Metadata'
                workflow_status:
                  type: string
                  nullable: false
                  enum: ['not_started', 'in_progress', 'on_hold', 'completed', 'no_quote']
                  example: 'in_progress'
    get:
      summary: Get details for a QuoteItem.
      description: Get details for a QuoteItem.
      operationId: 'getQuoteItem'
      parameters:
        - $ref: '#/components/parameters/quoteItemUuid'
        - in: query
          name: expand
          schema:
            type: string
          required: False
          description: "Expand a fields that provides UUID(s) to provide the full object(s) instead. Valid choices are: 'add_ons', 'discounts', material', 'operations', 'part', 'pricing_items', 'process', 'quantities'"
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLine'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"

    delete:
      summary: Delete a QuoteItem.
      operationId: 'deleteQuoteItem'
      parameters:
        - $ref: '#/components/parameters/quoteItemUuid'
      tags:
        - Quotes
      responses:
        204:
          description: Successful response

  /quotes/public/items/{quoteItemUuid}/bulk_update_operations:
    patch:
      summary: Bulk update a QuoteItem's operations.
      description: Bulk updates specific operations on a QuoteItem.
      operationId: 'bulkUpdateOperations'
      parameters:
        - $ref: '#/components/parameters/quoteItemUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                example: []
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLineOperation'
                type: object
                properties:
                  uuid:
                    type: string
                    example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                    nullable: false
                    description: The UUID of the operation you want to apply these updates to
                  name:
                    type: string
                    example: Name
                    nullable: true
                    description: The name of the operation
                  notes:
                    type: string
                    example: notes
                    nullable: true
                    description: The operation's notes
                  is_finish:
                    type: boolean
                    example: False
                    nullable: true
                    description: Whether the operation is a finish
                  is_outside_service:
                    type: boolean
                    example: True
                    nullable: true
                    description: Whether the operation is an outside service
                  costing_variable_overrides:
                    $ref: '#/components/schemas/CostingVariableOverrides'
                  position:
                    type: integer
                    example: 0
                    nullable: true
                    description: The position of the operation
                  runtime_display_units:
                    type: string
                    example: hr
                    nullable: true
                    description: The runtime display units for the operation
                  setup_time_display_units:
                    type: string
                    example: min
                    nullable: true
                    description: The setup time display units for the operation

  /quotes/public/operations:
    post:
      summary: "Create a new operation for a quote item"
      description: "Attach a new Operation to a QuoteItem"
      operationId: "CreateOperation"
      tags:
        - Quotes
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineOperation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quote_item:
                  type: string
                  description: The UUID of the quote item to tie the operation to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                operation_definition:
                  type: string
                  description: The UUID of the operation definition to generate the operation from.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                is_finish:
                  type: boolean
                  default: false
                is_outside_service:
                  type: boolean
                  default: false
                name:
                  type: string
                notes:
                  type: string

  /quotes/public/operations/{operationUuid}:
    get:
      summary: Get details for an Operation.
      description: Get details for an Operation.
      operationId: 'getOperation'
      parameters:
        - $ref: '#/components/parameters/operationUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineOperation'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"

    patch:
      summary: Update fields on an Operation.
      description: Update field on an Operation.
      operationId: 'updateOperation'
      parameters:
        - $ref: '#/components/parameters/operationUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineOperation'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_finish:
                  type: boolean
                  default: false
                is_outside_service:
                  type: boolean
                  default: false
                name:
                  type: string
                notes:
                  type: string
                costing_variable_overrides:
                  $ref: '#/components/schemas/CostingVariableOverrides'

    delete:
      summary: Delete an Operation.
      operationId: 'deleteOperation'
      parameters:
        - $ref: '#/components/parameters/operationUuid'
      tags:
        - Quotes
      responses:
        204:
          description: Successful response

  /quotes/public/add_ons/{addOnUuid}:
    get:
      summary: Get details for an Add-On.
      description: Get details for an Add-On.
      operationId: 'getAddOn'
      parameters:
        - $ref: '#/components/parameters/addOnUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineAddOn'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"

    patch:
      summary: Update details for an Add-On.
      description: Update details for an Add-On.
      operationId: updateAddOn
      parameters:
        - $ref: '#/components/parameters/addOnUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineAddOn'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Quote not found
                type: string
                example: "Error: Not Found"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_required:
                  type: boolean
                  description: Indicates whether or not this add-on is required.
                name:
                  type: string
                  description: The name of the add-on.
                notes:
                  type: string
                  description: Notes for this add-on.

  /quotes/public/discounts:
    post:
      summary: "Create a new Discount for a quote item"
      description: "Attach a new Discount to a QuoteItem"
      operationId: "CreateDiscount"
      tags:
        - Quotes
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineDiscount'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quote_item:
                  type: string
                  description: (Required) The UUID of the quote item to tie the add-on to.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                discount_definition:
                  type: string
                  description: The UUID of the Discount definition to generate the Discount from.
                  example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
                name:
                  type: string
                  description: The name of the Discount. Don't provide this value if using a Discount definition.
                notes:
                  type: string
                  description: Notes for this Discount.

  /quotes/public/discounts/{discountUuid}:
    get:
      summary: Get details for an Discount.
      description: Get details for a Discount.
      operationId: 'getDiscount'
      parameters:
        - $ref: '#/components/parameters/discountUuid'
        - in: query
          name: expand
          schema:
            type: string
          required: false
          description: "Expand fields that provides UUID(s) to provide the full object(s) instead. Valid choices are: 'discount_quantities'."
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineDiscount'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Discount not found
                type: string
                example: "Error: Not Found"

    patch:
      summary: Update fields on a Discount.
      description: Update field on a Discount.
      operationId: updateDiscount
      parameters:
        - $ref: '#/components/parameters/discountUuid'
      tags:
        - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteLineDiscount'
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Discount not found
                type: string
                example: "Error: Not Found"
      requestBody:
        required: true
        content:
          application/json:
            schema:
