          type: array
          items:
            $ref: '#/components/schemas/QuoteCostingVariable'
        costing_variable_overrides:
          $ref: '#/components/schemas/CostingVariableOverrides'
    CostingVariableOverrides:
      type: object
      description: Costing variable value overrides, as a JSON-formatted map from variable name to override value. Variable values may be overridden on a quantity-specific basis. To remove an override, supply a value of "null" for a variable. To remove all overrides, supply a value of "null" for this field.
      additionalProperties:
        $ref: '#/components/schemas/CostingVariableOverride'
      example: "{'work_center_id': 34, 'markup': {'1': 2, '5': 1.5, '10': 1}}"
    CostingVariableOverride:
      type: object
      description: Costing variable value override. May be quantity-specific.
      oneOf:
        - description: Value that should override the calculated value for all quantities.
          oneOf:
            - type: string
            - type: number
            - type: boolean
        - type: object
          description: Variable value overrides, as a map from quantity to value. Only applicable to quantity-specific variables.
          additionalProperties:
            description: Value that should override the calculated value for a particular quantity.
            oneOf:
              - type: string
              - type: number
              - type: boolean
      example: "{'1': 2, '5': 1.5, '10': 1}"
