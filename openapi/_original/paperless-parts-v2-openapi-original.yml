          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        quantities:
          type: array
          description: Array of quantity UUIDs
          items:
            type: string
          example: ["f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9", "414277a8-4144-49f6-9bc9-1bdcbc9f0749"]
        add_ons:
          type: array
          description: Array of add-on UUIDs
          items:
            type: string
          example: ["f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9", "414277a8-4144-49f6-9bc9-1bdcbc9f0749"]
        discounts:
          type: array
          description: Array of discount UUIDs
          items:
            type: string
          example: ["f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9", "414277a8-4144-49f6-9bc9-1bdcbc9f0749"]
        pricing_items:
          type: array
          description: Array of pricing item UUIDs
          items:
            type: string
          example: ["f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9", "414277a8-4144-49f6-9bc9-1bdcbc9f0749"]
        operations:
          type: array
          description: Array of operation UUIDs
          items:
            type: string
          example: ["f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9", "414277a8-4144-49f6-9bc9-1bdcbc9f0749"]
        metadata:
          $ref: '#/components/schemas/Metadata'
        workflow_status:
          type: string
          enum: ['not_started', 'in_progress', 'on_hold', 'completed', 'no_quote']
          example: 'in_progress'
    QuoteLineOperation:
      type: object
      description: "An operation on the root component of a QuoteLine."
      properties:
        uuid:
          type: string
          description: The UUID of the operation.
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        name:
          type: string
          description: The name of the operation.
        is_finish:
          type: boolean
