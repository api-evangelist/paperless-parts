                  type: string
                  example: 'mm'
                  nullable: True
                  description: The unit for part measurements
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'

  /parts/public/manual_assembly:
    post:
      summary: "Create a manual assembly"
      operationId: CreateManualAssembly
