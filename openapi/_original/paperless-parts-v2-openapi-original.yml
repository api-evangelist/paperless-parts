    QuoteCostingVariable:
      type: object
      description: "A CostingVariable is a piece of a Paperless Parts Programming Language (P3L) formula that determines the price and timing for an operation. CostingVariables are essentially Python variables and can represent several data types."
      properties:
        label:
          type: string
        variable_class:
          type: string
          enum: ['basic', 'drop_down', 'table']
        value_type:
          type: string
          enum: ['string', 'number', 'currency', 'boolean']
          description: "Describes the type of the 'value' key in quantities property"
        quantity_specific:
          type: boolean
          description: "Flag as to whether or not this costing variable can be manipulated for each quantity break"
        quantities:
          type: array
          items:
            type: object
            properties:
              stringQuotedQuantity1:
                type: object
                properties:
                  value:
                    anyOf:
                      - type: number
                      - type: string
                      - type: boolean
                    nullable: true
                  row:
                    type: object
                    nullable: true
                  options:
                    type: array
                    items:
                      anyOf:
                        - type: number
                        - type: string
                    nullable: true
              stringQuotedQuantity2:
                type: object
                properties:
                  value:
                    anyOf:
                      - type: number
                      - type: string
                      - type: boolean
                    nullable: true
                  row:
                    type: object
                    nullable: true
                  options:
                    type: array
                    items:
                      anyOf:
                        - type: number
                        - type: string
                    nullable: true
          description: "The value of the costing variable for each quoted quantity. This is an object with keys corresponding to the top level quote quantities in string form e.g. '1', '5', '10'. The values for each of these keys take different shape depending on the variable_class. If variable_class=='basic', the dictionary values will take the shape {'value': 1.0}. If variable_class=='drop_down', the dictionary values will take the shape {'value': 'a', 'options': ['a', 'b']}. If variable_class=='table', the dictionary values will take the shape {'value': 'a', 'row': {'column1': 'a', 'column2': 'b'}}. So for quoted quantities 1, 5, 10 for a basic variable_class, the object will look like: {'1': {'value': 1.0}, '5': {'value': 2.0}, '10': {'value': 3.0}}"
        type:
          type: string
          description: "To Be Deprecated"
          deprecated: false
        value:
          anyOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
          nullable: true
          description: "This will be indicated by the value_type field. To Be Deprecated"
          deprecated: false
        row:
          type: object
          nullable: true
          description: "The row field will only be non-null when the type field is 'table'. Row represents a row in a lookup table and is an object with arbitrary keys. To Be Deprecated"
          deprecated: false
    OrderCostingVariable:
      type: object
      description: "A CostingVariable is a piece of a Paperless Parts Programming Language (P3L) formula that determines the price and timing for an operation. CostingVariables are essentially Python variables and can represent several data types. An OrderCostingVariable represents the value a variable holds for the ordered quantity."
      properties:
        label:
          type: string
        variable_class:
          type: string
          enum: ['basic', 'drop_down', 'table']
        value_type:
          type: string
          enum: ['string', 'number', 'currency', 'boolean']
        value:
          anyOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
          nullable: true
          description: "This will be indicated by the value_type field."
        row:
          type: object
          nullable: true
          description: "An object representing a row from a custom table. This object will have arbitrary key-value pairs based on custom table schema it was pulled from. The row field will only be non-null when the variable_class field is 'table'."
        options:
          type: array
          items:
            anyOf:
              - type: number
              - type: string
          nullable: true
          description: "A list of the options for a drop down variable. Can be strings, floats, or integers indicated by value_type. The options field will only be non-null when the variable_class field is 'drop_down'."
        type:
          type: string
          description: "To Be Deprecated"
          deprecated: false
