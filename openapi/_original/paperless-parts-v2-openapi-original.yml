  /contacts/public:
    get:
      summary: List contacts
      description:
        "Returns a list of contacts. The contacts are returned 20 results at a time and can be iterated over by using the page parameter."
      operationId: ListContacts
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: False
          description: "Value used to search against the following fields: email, first name, last name, notes, phone, and account_id. Comparisons are not case sensitive and will match when the field value includes the search value as a substring."
        - in: query
          name: page
          schema:
            type: string
          required: False
          description: "The page of results to return."
        - in: query
          name: account_id
          schema:
            type: integer
          required: false
          description: The id of the account who's contacts to return. Must be an exact match.
          example: 17
        - in: query
          name: metadata
          schema:
            type: string
          required: False
          description: "Metadata is a dictionary-like object that allows developers to add arbitrary key/value pairs to an object in Paperless Parts. A classic use case for metadata is storing the ID of the object in an external system. To filter on metadata, supply a query parameter named with the syntax: metadata[metadata_key]. For example, if you wanted to filter on a metadata key/value pair of crm_id/ABC123, you would supply a query parameter called metadata[crm_id] and a value of ABC123."
          example: 'ABC123'
      tags:
        - Contacts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: The total number of records matching the supplied query parameters
                  next:
                    type: string
                    description: The URL of the next page of results. Null if this is the last page
                    nullable: true
                  previous:
                    type: string
                    description: The URL of the previous page of results. Null if this is the first page
                    nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: integer
                          example: 17
                          nullable: true
                          description: the ID of the associated Account
                        created:
                          type: string
                          example: "2020-08-25T18:00:53+00:00"
                        email:
                          type: string
                          example: careers@paperlessparts.com
                          description: email address (must be non-null, unique across all Contacts, and a valid email format)
                        first_name:
                          type: string
                          example: Gordon
                          description: Contact first name (must be non-null)
                        id:
                          type: integer
                          example: 137
                        last_name:
                          type: string
                          example: Moore
                          description: Contact last name (must be non-null)
                        phone:
                          type: string
                          nullable: true
                          example: "6176354500"
                          description: Contact phone number
                        phone_ext:
                          type: string
                          nullable: true
                          example: null
                          description: Contact phone number extension
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Contacts not found
                type: string
                example: "Error: Not Found"
    post:
      summary: Create new contact
      description: Creates a new contact.
      operationId: CreateContact
      tags:
        - Contacts
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
                  nullable: true
                  description: the ID of the associated Account
                  example: 137
                address:
                  type: object
                  description: the contact's address
                  nullable: true
                  properties:
                    address1:
                      type: string
                      nullable: false
                      description: The street address
                      example: 137 Portland St.
                    address2:
                      type: string
                      nullable: true
                      description: Unit #
                      example: Unit 1
                    city:
                      type: string
                      nullable: false
                      description: The city of the address
                      example: Boston
                    country:
                      type: string
                      nullable: false
                      description: The three character country abbreviation
                      example: USA
                    postal_code:
                      type: string
                      nullable: false
                      description: The postal code for the address
                      example: "02114"
                    state:
                      type: string
                      nullable: false
                      description: The two character state abbreviation
                      example: MA
                email:
                  type: string
                  nullable: false
                  description: email address (must be non-null, unique across all Contacts, and a valid email format)
                  example: careers@paperlessparts.com
                first_name:
                  type: string
                  nullable: false
                  description: Contact first name (must be non-null)
                  example: Gordon
                last_name:
                  type: string
                  nullable: false
                  description: Contact last name (must be non-null)
                  example: Moore
                notes:
                  type: string
                  nullable: true
                  description: Contact notes
                phone:
                  type: string
                  nullable: true
                  example: "6176354500"
                  description: Customer phone number
                phone_ext:
                  type: string
                  nullable: true
                  example: null
                  description: Customer phone number extension
                salesperson:
                  type: object
                  description: the contacts salesperson
                  nullable: true
                  properties:
                    email:
                      type: string
                      nullable: false
                      description: The salespersons email address. Must correspond to an active team member in your Paperless Parts account.
                      example: "careers@paperlessparts.com"


