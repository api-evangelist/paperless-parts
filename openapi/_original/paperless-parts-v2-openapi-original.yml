                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        child:
                          type: number
                          example: -2
                          nullable: False
                          description: The temporary id of the child part
                        count:
                          type: number
                          example: 1
                          nullable: False
                          description: The number of times the child occurs
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assembly'

  /parts/public/{partUuid}/status:
    get:
      summary: "Get the status of a part"
      parameters:
        - $ref: '#/components/parameters/partUuid'
      operationId: GetPartStatus
      tags:
        - Parts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartStatus"

  /parts/public/part_files/{uuid}/flat_pattern_dxf:
    get:
      summary: "Get flat pattern DXF download link and warnings"
      description: "Returns an authenticated download URL for the flat pattern DXF file along with flat pattern origin information and warning messages. The flat pattern DXF file must be available for the part file."
      parameters:
        - name: uuid
          in: path
          description: "The part file UUID"
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      operationId: GetFlatPatternDXFDownload
      tags:
        - Parts
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    description: "The authenticated download URL for the flat pattern DXF file"
                    example: "https://api.paperlessparts.com/api/v2/parts/public/part_files/3ec5051e-9d2d-4ea4-b903-abd9b6aa3448/flat_pattern_dxf?token=..."
                  flat_pattern_origin:
                    type: string
                    nullable: true
                    description: "The origin type of the flat pattern. Possible values are: '3D-unfolded', '3D-flat', 'PDF-vectorized', 'DXF-edited', 'DXF-uploaded', 'DWG-edited', 'DWG-uploaded'"
                  warning_message:
                    type: string
                    nullable: true
                    description: "Warning message about the flat pattern, if applicable"
        404:
          description: Not found response
          content:
            text/plain:
              schema:
                title: Flat pattern DXF not available
                type: string
                example: "Flat pattern DXF file not available for this part."

  /suppliers/public/purchased_components_csv:
    get:
      summary: Retrieve purchased components csv
      description: Retrieve all purchased components for account in csv format
      operationId: GetPurchasedComponentCSV
      tags:
        - Purchased Components

      responses:
        200:
          description: Successful Response
          content:
            text/csv:
              schema:
                type: string

    post:
      summary: Upload purchased components csv
      description: Replace all purchased components for account based on uploaded csv
      operationId: PostPurchasedComponentCSV
      tags:
        - Purchased Components

      responses:
        204:
          description: Successful Response

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                csv_file:
                  type: string
                  format: binary

components:
  securitySchemes:
    app_id:
      type: apiKey
      description: "API key to authorize requests."
      name: Authorization
      in: header

  parameters:
    last_quote:
      name: last_quote
      in: query
      description: "**Last known sent quote number**. You may supply the number of the last known quote."
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    revision:
      name: revision
      in: query
      description: "**Last known sent quote revision number**. You may supply the revision number of the last known quote."
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    quoteNumber:
      name: quoteNumber
      in: path
      description: "The quote number"
      required: true
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    quoteUuid:
      name: quoteUuid
      in: path
      description: "The quote UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    quoteItemId:
      name: quoteItemId
      in: path
      description: "The QuoteItem Id"
      required: true
      schema:
        $ref: '#/components/schemas/QuoteItemId'
    quoteItemUuid:
      name: quoteItemUuid
      in: path
      description: "The QuoteItem UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    operationUuid:
      name: operationUuid
      in: path
      description: "The Operation UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    addOnUuid:
      name: addOnUuid
      in: path
      description: "The Add-On UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    discountUuid:
      name: discountUuid
      in: path
      description: "The Discount UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    pricingItemUuid:
      name: pricingItemUuid
      in: path
      description: "The Pricing Item UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    partUuid:
      name: partUuid
      in: path
      description: "The part UUID"
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    revisionNumber:
      name: revision
      in: query
      description: "The (optional) quote revision number"
      required: false
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    last_order:
      name: last_order
      in: query
      description: "**Last known order number**. You may supply the number of the last known order."
      schema:
        $ref: '#/components/schemas/OrderNumber'
    orderNumber:
      name: orderNumber
      in: path
      description: "The order number"
      required: true
      schema:
        $ref: '#/components/schemas/OrderNumber'
    accountLocator:
      name: accountLocator
      in: path
      description: "The text identifier (slug) for the account"
      required: true
      schema:
        $ref: '#/components/schemas/AccountLocator'
    tableName:
      name: tableName
      in: path
      description: "The name of the table"
      required: true
      schema:
        $ref: '#/components/schemas/TableName'
    contactId:
      name: contactId
      in: path
      description: The integer idenfier of a Contact, assigned automatically by Paperless Parts
      required: true
      schema:
        $ref: '#/components/schemas/CustomerId'
    erp_code:
      name: erp_code
      in: query
      description: The erp code of the company to retrieve
      example: "PPI"
      schema:
        $ref: '#/components/schemas/ErpCode'
    accountId:
      name: accountId
      in: path
      required: true
      example: 17
      schema:
        $ref: '#/components/schemas/AccountId'
    paymentTermsId:
      name: paymentTermsId
      in: path
      required: true
      example: 1234
      schema:
        $ref: '#/components/schemas/PaymentTermsId'
    userUuid:
      name: userUuid
      in: path
      required: true
      example: 37d984ea-ec42-4a00-9cd1-a4cc73bb721e
      schema:
        $ref: '#/components/schemas/UserUuid'
    billingAddressId:
      name: billingAddressId
      in: path
      required: true
      example: 27
      schema:
        $ref: '#/components/schemas/BillingAddressId'
    facilityId:
      name: facilityId
      in: path
      required: true
      example: 30
      schema:
        $ref: '#/components/schemas/FacilityId'
    purchasedComponentsColumnId:
      name: purchasedComponentsColumnId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PurchasedComponentsColumnId'
    purchasedComponentId:
      name: purchasedComponentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PurchasedComponentId'
    jobId:
      name: jobId
      in: path
      required: true
      example: 37
      schema:
        $ref: '#/components/schemas/JobId'
    position:
      name: position
      in: path
      required: true
      example: 3
      schema:
        $ref: '#/components/schemas/Position'
    uuid:
      name: uuid
      in: path
      required: true
      example: 2f0e5724-42fe-47ae-8233-7a902ef70346
      schema:
        $ref: '#/components/schemas/Uuid'

  schemas:
    AccountLocator:
      type: string
      description: "The text identifier (slug) for the account"
      example: acme-machining
    TableName:
      type: string
      description: "The name of the table"
      example: sample_table
    AccountId:
      type: integer
      description: "The account id"
      example: '13'
    PaymentTermsId:
      type: integer
      description: "The payment terms id"
      example: '1234'
    UserUuid:
      type: string
      description: "The user uuid"
      example: '37d984ea-ec42-4a00-9cd1-a4cc73bb721e'
    BillingAddressId:
      type: integer
      description: "The billing address id"
      example: '27'
    CustomerId:
      type: integer
      description: "The customer id"
      example: '32'
    ErpCode:
      type: string
      description: "The erp code for a comapny"
      example: 'PPI'
    FacilityId:
      type: integer
      description: "The facility id"
      example: '30'
    JobId:
      type: integer
      description: "The job id"
      example: 37
    Position:
      type: integer
      description: "Position in list"
      example: 3
    Uuid:
      type: string
      description: "Unique identifier"
      example: 2f0e5724-42fe-47ae-8233-7a902ef70346
    QuoteItemId:
      type: integer
      description: "The QuoteItem id"
      example: 1349
    QuoteNumber:
      type: integer
      description: "In conjunction with the revision number, forms a unique identifier for a Quote"
      example: 37
    RevisionNumber:
      type: integer
      description: "A unique revision number for a Quote. May be null."
      example: 1
    QuoteRevisionPair:
      type: object
      properties:
        quote:
          $ref: '#/components/schemas/QuoteNumber'
        revision_number:
          $ref: '#/components/schemas/RevisionNumber'
    QuoteNumberArray:
      type: array
      items:
        $ref: '#/components/schemas/QuoteRevisionPair'
    PurchasedComponentProperty:
      type: object
      properties:
        name:
          type: string
          description: "Name of corresponding purchased component column in table display"
        code_name:
          type: string
          description: "Name used to access property within pricing formulas via 'dot' operator"
        value_type:
          type: string
          enum: ['string', 'boolean', 'numeric']
        value:
          anyOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: "Value of property, None or of type corresponding to value_type"
    PurchasedComponentCustomProperty:
      type: object
      properties:
        key:
          type: string
          description: "Name of corresponding purchased component column in table display"
          example: property name
        value:
          anyOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
          description: "Value of property, None or of type corresponding to value_type"
          example: really cool value
    AbstractPurchasedComponent:
      type: object
      properties:
        oem_part_number:
          type: string
          description: "Unique identifier for purchased component within a supplier account"
          example: "064-1235"
        internal_part_number:
          type: string
          nullable: true
          example: a
        description:
          type: string
          nullable: true
          example: any text you want
        piece_price:
          type: number
          format: decimal
          nullable: false
          description: "Cost per piece to 4 decimal places"
          example: 2.0000
    PostPurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentCustomProperty'
          required:
            - oem_part_number
            - piece_price
            - properties
    PatchPurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentCustomProperty'
    PurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            id:
              type: integer
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentCustomProperty'
    QuotePurchasedComponent:
      allOf:
        - $ref: '#/components/schemas/AbstractPurchasedComponent'
        - type: object
          properties:
            id:
              type: string
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PurchasedComponentProperty'
    QuoteExpedite:
      type: object
      description: "Expedites represent an additional option for pricing where quote recipients can request a shorter lead time, with an additional markup applied to the unit price."
      properties:
        id:
          type: integer
        lead_time:
          type: integer
          description: "Days"
        markup:
          type: number
          format: float
          description: "Percent"
        unit_price:
          type: number
          format: float
        total_price:
          type: number
          format: float
    QuoteFile:
      type: object
      properties:
        authenticated_download_url:
          type: string
          format: url
          nullable: true
          example: 'https://api.paperlessparts.com/parts/files/b2145332-75dc-4be4-a092-fb97bdb5815a/download/wire-mount.step?token=token'
        category:
          type: string
          enum: ["RFQ_FILE", "VENDOR_QUOTE", "SUPPORTING_FILE"]
          example: 'SUPPORTING_FILE'
        is_export_controlled:
          type: boolean
          example: 'false'
        filename:
          type: string
          example: 'wire_mount.step'
        file_size:
          type: integer
          example: 395516
        file_type:
          type: string
          example: 'step'
        status:
          type: object
        uuid:
          type: string
          example: 'b2145332-75dc-4be4-a092-fb97bdb5815a'
    QuoteQuantity:
      type: object
      description: "A quantity object represents a unit price and a numerical quantity associated with a component. A component can have many quantities, and the set of quantities represents the pricing options available to the recipient of a quote."
      properties:
        id:
          type: integer
        quantity:
          type: integer
        markup_1_price:
          type: number
          format: float
          description: "Users of Paperless Parts can specify up to two distinct markup values on a component."
          nullable: true
        markup_1_name:
          type: string
          nullable: true
        markup_2_price:
          type: number
          format: float
          description: "Users of Paperless Parts can specify up to two distinct markup values on a component."
          nullable: true
        markup_2_name:
          type: string
          nullable: true
        unit_price_before_discounts:
          type: number
          format: float
        total_price_before_discounts:
          type: number
          format: float
        total_discount:
          type: number
          format: float
        total_discount_percentage:
          type: number
          format: float
        unit_price:
          type: number
          format: float
        total_price:
          type: number
          format: float
        total_price_with_required_add_ons:
          type: number
          format: float
        lead_time:
          type: integer
          description: "Days"
        expedites:
          type: array
          items:
            $ref: '#/components/schemas/QuoteExpedite'
        is_most_likely_won_quantity:
          type: boolean
          description: "Whether or not this quantity is the most likely quantity to be won."
        most_likely_won_quantity_percent:
          type: integer
    QuoteProcess:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        external_name:
          type: string
          nullable: true
    QuoteMaterial:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
    QuoteAddOnQuantity:
      type: object
      properties:
        price:
          type: number
          format: float
        manual_price:
          type: number
          format: float
        quantity:
          type: integer
    QuoteAddOn:
      type: object
      properties:
        is_required:
          type: boolean
        name:
          type: string
        erp_code:
          type: string
        notes:
          type: string
        quantities:
          type: array
          items:
            $ref: '#/components/schemas/QuoteAddOnQuantity'
        costing_variables:
          type: array
          items:
            $ref: '#/components/schemas/QuoteCostingVariable'
