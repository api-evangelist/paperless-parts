  /quotes/public/{quoteUuid}/files:
    post:
      summary: Create quote file
      description: Upload a supporting file to a quote.
      operationId: createQuoteFile
      parameters:
      - $ref: '#/components/parameters/quoteUuid'
      tags:
      - Quotes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file contents to upload.
                category:
                  type: string
                  enum:
                  - RFQ_FILE
                  - VENDOR_QUOTE
                  - SUPPORTING_FILE
                  description: 'The category of quote-supporting file: "RFQ_FILE", "VENDOR_QUOTE", or "SUPPORTING_FILE". If not specified, this defaults to "SUPPORTING_FILE".'
                is_export_controlled:
                  type: boolean
                  description: Whether this file contains data that is export controlled (ITAR) by the US Government. If not specified, this defaults to false.
                thickness:
                  type: number
                  format: float
                  description: This can be included to specify the part thickness if the file contains geometric data.
                units:
                  type: string
                  enum:
                  - in
                  - mm
                  description: This can be included to specify the units of measurement ("in" or "mm") if the file contains geometric data.
      responses:
        201:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteFile_2'
        404:
          description: Quote file not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: 'true'
                  code:
                    type: string
                    example: not_found
                  message:
                    type: string
                    example: Not found.
                  extra:
                    type:
                    - object
                    - 'null'
                    example: null
    servers:
    - url: '{url}/{version}'
      variables:
        url:
          default: https://api.paperlessparts.com
        version:
          default: v2
  /quotes/public/{quoteUuid}/files/{fileUuid}:
