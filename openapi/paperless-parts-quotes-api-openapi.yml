        markup_1_name:
          type:
          - string
          - 'null'
        markup_2_price:
          type:
          - number
          - 'null'
          format: float
          description: Users of Paperless Parts can specify up to two distinct markup values on a component.
        markup_2_name:
          type:
          - string
          - 'null'
        unit_price_before_discounts:
          type: number
          format: float
        total_price_before_discounts:
          type: number
          format: float
        total_discount:
          type: number
          format: float
        total_discount_percentage:
          type: number
          format: float
        unit_price:
          type: number
          format: float
        total_price:
