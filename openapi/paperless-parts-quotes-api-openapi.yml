                properties:
                  error:
                    type: boolean
                    example: 'true'
                  code:
                    type: string
                    example: not_found
                  message:
                    type: string
                    example: Not found.
                  extra:
                    type:
                    - object
                    - 'null'
                    example: null
    servers:
    - url: '{url}/{version}'
      variables:
        url:
          default: https://api.paperlessparts.com
        version:
          default: v2
  /quotes/public/pricing_item_quantities/{uuid}:
    get:
      summary: Get a pricing item quantity
      description: Get details of a single pricing item quantity.
      operationId: GetPricingItemQuantity
      parameters:
      - in: path
        required: true
        name: uuid
        schema:
          type: string
          description: A unique identifier for a pricing item quantity
      tags:
      - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitItemCell'
    patch:
      summary: Update a pricing item quantity
      description: Update the manual profit or manual percentage of a pricing item quantity.
      operationId: UpdatePricingItemQuantity
      parameters:
      - in: path
        required: true
        name: uuid
        schema:
          type: string
          description: A unique identifier for a pricing item quantity
      tags:
      - Quotes
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitItemCell'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manual_profit:
                  type: number
                  format: float
                  description: The profit value to update the pricing item quantity. Do not include manual_percentage in the request body if this is set.
                manual_percentage:
                  type: number
                  format: float
                  description: The profit percentage to update the pricing item quantity. Do not include manual_profit in the request body if this is set.
    servers:
    - url: '{url}/{version}'
      variables:
        url:
          default: https://api.paperlessparts.com
        version:
          default: v2
components:
  parameters:
    last_quote:
      name: last_quote
      in: query
      description: '**Last known sent quote number**. You may supply the number of the last known quote.'
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    revisionNumber:
      name: revision
      in: query
      description: The (optional) quote revision number
      required: false
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    quoteNumber:
      name: quoteNumber
      in: path
      description: The quote number
      required: true
      schema:
        $ref: '#/components/schemas/QuoteNumber'
    revision:
      name: revision
      in: query
      description: '**Last known sent quote revision number**. You may supply the revision number of the last known quote.'
      schema:
        $ref: '#/components/schemas/RevisionNumber'
    discountUuid:
      name: discountUuid
      in: path
      description: The Discount UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    operationUuid:
      name: operationUuid
      in: path
      description: The Operation UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    pricingItemUuid:
      name: pricingItemUuid
      in: path
      description: The Pricing Item UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    quoteItemUuid:
      name: quoteItemUuid
      in: path
      description: The QuoteItem UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    addOnUuid:
      name: addOnUuid
      in: path
      description: The Add-On UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    quoteUuid:
      name: quoteUuid
      in: path
      description: The quote UUID
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    QuoteQuantity:
      type: object
      description: A quantity object represents a unit price and a numerical quantity associated with a component. A component can have many quantities, and the set of quantities represents the pricing options available to the recipient of a quote.
      properties:
        id:
          type: integer
        quantity:
          type: integer
        markup_1_price:
          type:
          - number
          - 'null'
          format: float
          description: Users of Paperless Parts can specify up to two distinct markup values on a component.
        markup_1_name:
          type:
          - string
          - 'null'
        markup_2_price:
          type:
          - number
          - 'null'
          format: float
          description: Users of Paperless Parts can specify up to two distinct markup values on a component.
        markup_2_name:
          type:
          - string
          - 'null'
        unit_price:
          type: number
          format: float
        total_price:
          type: number
          format: float
        total_price_with_required_add_ons:
          type: number
          format: float
        lead_time:
          type: integer
          description: Days
        expedites:
          type: array
          items:
            $ref: '#/components/schemas/QuoteExpedite'
        is_most_likely_won_quantity:
          type: boolean
          description: Whether or not this quantity is the most likely quantity to be won.
        most_likely_won_quantity_percent:
          type: integer
        deliver_quantity:
          type: integer
        make_quantity:
          type: integer
        manual_total_unit_price:
          type:
          - number
          - 'null'
          format: float
        total_component_overrides_cost:
          type:
          - number
          - 'null'
          format: float
        total_discount:
          type:
          - number
          - 'null'
          format: float
        total_discount_percentage:
          type:
          - number
          - 'null'
          format: float
        total_inside_processing_cost:
          type:
          - number
          - 'null'
          format: float
        total_outside_processing_cost:
          type:
          - number
          - 'null'
          format: float
        total_price_before_discounts:
          type:
          - number
          - 'null'
          format: float
        total_purchased_component_cost:
          type:
          - number
          - 'null'
          format: float
        total_raw_material_cost:
          type:
          - number
          - 'null'
          format: float
        unit_price_before_discounts:
          type:
          - number
          - 'null'
          format: float
        yield_pct:
          type:
          - number
          - 'null'
          format: float
    PurchasedComponentProperty:
      type: object
      properties:
        name:
          type: string
          description: Name of corresponding purchased component column in table display
        code_name:
          type: string
          description: Name used to access property within pricing formulas via 'dot' operator
        value_type:
          type: string
          enum:
          - string
          - boolean
          - numeric
        value:
          anyOf:
          - type: string
          - type: number
          - type: boolean
          description: Value of property, None or of type corresponding to value_type
    QuoteCostingVariable:
      type: object
      description: A CostingVariable is a piece of a Paperless Parts Programming Language (P3L) formula that determines the price and timing for an operation. CostingVariables are essentially Python variables and can represent several data types.
      properties:
        label:
          type: string
        variable_class:
          type: string
          enum:
          - basic
          - drop_down
          - table
        value_type:
          type: string
          enum:
          - string
          - number
          - currency
          - boolean
          description: Describes the type of the 'value' key in quantities property
        quantity_specific:
          type: boolean
          description: Flag as to whether or not this costing variable can be manipulated for each quantity break
        quantities:
          type: array
          items:
            type: object
            properties:
              stringQuotedQuantity1:
                type: object
                properties:
                  value:
                    anyOf:
                    - type: number
                    - type: string
                    - type: boolean
                  row:
                    type:
                    - object
                    - 'null'
                  options:
                    type:
                    - array
                    - 'null'
                    items:
                      anyOf:
                      - type: number
                      - type: string
              stringQuotedQuantity2:
                type: object
                properties:
                  value:
                    anyOf:
                    - type: number
                    - type: string
                    - type: boolean
                  row:
                    type:
                    - object
                    - 'null'
                  options:
                    type:
                    - array
                    - 'null'
                    items:
                      anyOf:
                      - type: number
                      - type: string
          description: 'The value of the costing variable for each quoted quantity. This is an object with keys corresponding to the top level quote quantities in string form e.g. ''1'', ''5'', ''10''. The values for each of these keys take different shape depending on the variable_class. If variable_class==''basic'', the dictionary values will take the shape {''value'': 1.0}. If variable_class==''drop_down'', the dictionary values will take the shape {''value'': ''a'', ''options'': [''a'', ''b'']}. If variable_class==''table'', the dictionary values will take the shape {''value'': ''a'', ''row'': {''column1'': ''a'', ''column2'': ''b''}}. So for quoted quantities 1, 5, 10 for a basic variable_class, the object will look like: {''1'': {''value'': 1.0}, ''5'': {''value'': 2.0}, ''10'': {''value'': 3.0}}'
        type:
          type: string
          description: To Be Deprecated
          deprecated: false
        value:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          description: This will be indicated by the value_type field. To Be Deprecated
          deprecated: false
        row:
          type:
          - object
          - 'null'
          description: The row field will only be non-null when the type field is 'table'. Row represents a row in a lookup table and is an object with arbitrary keys. To Be Deprecated
          deprecated: false
    SalesPerson:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        erp_code:
          type: string
    QuoteItem:
      type: object
      description: A quote item represents a line item in a quote. Quote items can either be manual or automatic, as indicated by the 'type' property. Automatic quote items are those generated by adding a part to a quote. Pricing data for automatic quote items is automatically populated using the process, material, and operations, if they exist. Manual quote items do not have an associated part, so the pricing information must be inputted manually.
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - automatic
          - manual
          description: Indicates whether the quote item is associated with a part (automatic pricing), or not (manual pricing).
        root_component_id:
          type: integer
          description: ID of the root component. A root component houses the pricing information for a quote item. Every quote item has a root component. In the case of an automatic quote item, the root component corresponds to a part; in the case of a manual quote item, which does not have an associated part, the root component stores the manual pricing data. As the name 'root component' implies, it is possible for a quote item to have many components, as in the case of an assembly of nested parts.
        components:
          type: array
          items:
            $ref: '#/components/schemas/QuoteComponent'
        position:
          type: integer
          description: The position of the quote item in the quote display, indexed from 1.
        export_controlled:
          type: boolean
          description: Whether or not this quote item contains data that is export controlled (ITAR) by the US Government.
        component_ids:
          type: array
          items:
            type: integer
        metadata:
          type:
          - object
          - 'null'
        private_notes:
          type:
          - string
          - 'null'
        public_notes:
          type:
          - string
          - 'null'
        workflow_status:
          type:
          - string
          - 'null'
        root_component:
          deprecated: true
          type:
          - object
          - 'null'
    OrderNumberArray:
      type: array
      items:
        $ref: '#/components/schemas/OrderNumber'
      description: An array of Order numbers
      example:
      - 38
      - 39
      - 40
    ComponentChild:
      type: object
      properties:
        child_id:
          type: integer
          description: ID of the child component
        quantity:
          type: integer
          description: The number of child component instances belonging to this parent. Note, the total number of instances of this child component in this assembly tree may be larger if this child appears in multiple places in the tree.
    QuotePurchasedComponent:
      allOf:
      - $ref: '#/components/schemas/AbstractPurchasedComponent'
      - type: object
        properties:
          id:
            type: string
          properties:
            type: array
            items:
              $ref: '#/components/schemas/PurchasedComponentProperty'
    QuoteAddOn:
      type: object
      properties:
        is_required:
          type: boolean
        name:
          type: string
        erp_code:
          type: string
        notes:
          type: string
        quantities:
          type: array
          items:
            $ref: '#/components/schemas/QuoteAddOnQuantity'
        costing_variables:
          type: array
          items:
            $ref: '#/components/schemas/QuoteCostingVariable'
    AbstractPurchasedComponent:
      type: object
      properties:
        oem_part_number:
          type: string
          description: Unique identifier for purchased component within a supplier account
          example: 064-1235
        internal_part_number:
          type:
          - string
          - 'null'
          example: a
        description:
          type:
          - string
          - 'null'
          example: any text you want
        piece_price:
          type: number
          format: decimal
          description: Cost per piece to 4 decimal places
          example: 2.0
    OrderNumber:
      type: integer
      description: A unique identifier for an Order
      example: 47
    QuoteNumberArray:
      type: array
      items:
        $ref: '#/components/schemas/QuoteRevisionPair'
    QuoteComponent:
      type: object
      description: Represents a component in the quote item. In the simplest case, there is a single root component. If the quote item is an assembly, the array will contain each component in the assembly. Components can be manufactured (i.e., parts), assemblies (i.e., top-level or sub-assembly), or purchased (e.g., hardware). Exactly one component in the array will be the root component, but it might not be the first element in the array.
      properties:
        id:
          type: string
        add_ons:
          type: array
          items:
            $ref: '#/components/schemas/QuoteAddOn'
        discounts:
          type: array
          items:
            type: object
        is_assembly:
          type: boolean
        obtain_method:
          type:
          - string
          - 'null'
        part_custom_attrs:
          type: array
          items:
            type: object
        pricing_items:
          type: array
          items:
            type: object
        quantities:
          type: array
          items:
            $ref: '#/components/schemas/QuoteQuantity'
        child_ids:
          type: array
          items:
            type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/ComponentChild'
        description:
          type:
          - string
          - 'null'
        export_controlled:
          type: boolean
          description: Whether or not this component contains data that is export controlled (ITAR) by the US Government.
        finishes:
          type: array
          items:
            type: string
          description: 'Note: this field is deprecated. Finishes now show up as Operations.'
        innate_quantity:
          type: integer
          description: The quantity of this subcomponent that must be produced to make one top-level component.
        is_root_component:
          type: boolean
        material:
          $ref: '#/components/schemas/OrderMaterial'
        material_operations:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOperation'
        parent_ids:
          type: array
          items:
            type: integer
        part_name:
          type: string
        part_number:
          type:
          - string
          - 'null'
        part_url:
          type: string
          format: url
        part_uuid:
          type: string
        process:
          $ref: '#/components/schemas/OrderProcess'
        purchased_component:
          description: Reference to a purchased component object within the supplier account. Will be not null when type == 'purchased'
          $ref: '#/components/schemas/QuotePurchasedComponent'
        revision:
          type:
          - string
          - 'null'
        shop_operations:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOperation'
        supporting_files:
          type: array
          items:
            $ref: '#/components/schemas/OrderSupportingFile'
        thumbnail_url:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - assembled
          - manufactured
          - purchased
    Quote:
      type: object
      description: Data representing a Quote
      properties:
        uuid:
          type: string
          format: uuid
        authenticated_pdf_quote_url:
          type:
          - string
          - 'null'
          format: url
        contact:
          $ref: '#/components/schemas/QuoteContact'
        created:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/QuoteCustomer'
        digital_last_viewed_on:
          type:
          - string
          - 'null'
          format: date-time
          description: The last time the quote recipient viewed the quote
        due_date:
          type:
          - string
          - 'null'
          format: date-time
        erp_code:
          type:
          - string
          - 'null'
        estimator:
          $ref: '#/components/schemas/SalesPerson'
        metadata:
          type:
          - object
          - 'null'
        ordered_date:
          type:
          - string
          - 'null'
          format: date-time
        priority:
          type:
          - integer
          - 'null'
        rfq_number:
          type:
          - string
          - 'null'
        send_from_facility:
          $ref: '#/components/schemas/Facility'
        expired:
          type: boolean
        expired_date:
          type: string
          format: date-time
        export_controlled:
          type: boolean
          description: Whether or not this quote contains data that is export controlled (ITAR) by the US Government.
        id:
          type: integer
        is_unviewed_drafted_rfq:
          type: boolean
          description: Quotes can be automatically generated by a supplier's RFQ form. If this quote was drafted via an RFQ and has not been viewed, this will be true.
        number:
          $ref: '#/components/schemas/QuoteNumber'
        order_numbers:
          $ref: '#/components/schemas/OrderNumberArray'
        parent_quote:
          $ref: '#/components/schemas/ParentQuote'
        parent_supplier_order:
          $ref: '#/components/schemas/ParentSupplierOrder'
        private_notes:
          type:
          - string
          - 'null'
        quote_items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        quote_notes:
          type:
          - string
          - 'null'
        request_for_quote:
          $ref: '#/components/schemas/RequestForQuote'
        revision_number:
          $ref: '#/components/schemas/RevisionNumber'
        sales_person:
          deprecated: true
          $ref: '#/components/schemas/SalesPerson'
        salesperson:
          $ref: '#/components/schemas/SalesPerson'
        sent_date:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - draft
          - outstanding
          - expired
          - cancelled
          - partially_accepted
          - accepted
          - trash
          - lost
        tax_cost:
          type: number
          format: float
        tax_rate:
          type: number
          format: float
    QuoteNumber:
      type: integer
      description: A unique identifier for a Quote
      example: 37
    RequestForQuote:
      type: object
      description: Data representing a RequestForQuote object
      properties:
        id:
          type: integer
          example: '12334'
        email:
          type: string
          example: careers@paperlessparts.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Smith
        business_name:
          type: string
          example: ACME
        phone:
          type: string
          example: '5555555555'
        phone_ext:
          type: string
          example: '555'
        requested_delivery_date:
          type: string
          example: '2020-08-25'
        contact_info_conflict:
          type: boolean
          example: false
        marketing_source:
          type: string
          example: google
    QuoteFile:
      type: object
      properties:
        authenticated_download_url:
          type:
          - string
          - 'null'
          format: url
          example: https://api.paperlessparts.com/parts/files/b2145332-75dc-4be4-a092-fb97bdb5815a/download/wire-mount.step?token=token
        category:
          type: string
          enum:
          - RFQ_FILE
          - VENDOR_QUOTE
          - SUPPORTING_FILE
          example: SUPPORTING_FILE
        is_export_controlled:
          type: boolean
          example: 'false'
        filename:
          type: string
          example: wire_mount.step
