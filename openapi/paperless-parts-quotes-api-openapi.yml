          type: string
          description: The UUID of the add-on.
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        is_required:
          type: boolean
          description: Indicates whether or not this add-on is required.
        name:
          type: string
          description: The name of the add-on.
        quote_item_uuid:
          type: string
          description: The UUID of the quote item the add-on is tied to.
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        add_on_quantities:
          type: array
          description: Array of add-on quantity UUIDs
          items:
            type: string
          example:
          - f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
          - 414277a8-4144-49f6-9bc9-1bdcbc9f0749
    QuotePricingItemQuantity:
      type: object
      properties:
        uuid:
          type: string
          description: The UUID of the pricing item cell
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        quantity:
          type: integer
          description: The quantity of the pricing item cell
        profit_item:
          type: string
          description: The UUID of the pricing item
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        calculated_profit:
          type: number
          format: float
        calculated_percentage:
          type: number
        manual_profit:
          type: number
          format: float
        manual_percentage:
          type: number
    OrderCostingVariable:
      type: object
      description: A CostingVariable is a piece of a Paperless Parts Programming Language (P3L) formula that determines the price and timing for an operation. CostingVariables are essentially Python variables and can represent several data types. An OrderCostingVariable represents the value a variable holds for the ordered quantity.
      properties:
        label:
          type: string
        variable_class:
          type: string
          enum:
          - basic
          - drop_down
          - table
        value_type:
          type: string
          enum:
          - string
          - number
          - currency
          - boolean
        value:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          description: This will be indicated by the value_type field.
        row:
          type:
          - object
          - 'null'
          description: An object representing a row from a custom table. This object will have arbitrary key-value pairs based on custom table schema it was pulled from. The row field will only be non-null when the variable_class field is 'table'.
        options:
          type:
          - array
          - 'null'
          items:
            anyOf:
            - type: number
            - type: string
          description: A list of the options for a drop down variable. Can be strings, floats, or integers indicated by value_type. The options field will only be non-null when the variable_class field is 'drop_down'.
        type:
          type: string
          description: To Be Deprecated
          deprecated: false
    CostingVariableOverride:
      type: object
      description: Costing variable value override. May be quantity-specific.
      oneOf:
      - description: Value that should override the calculated value for all quantities.
        oneOf:
        - type: string
        - type: number
        - type: boolean
      - type: object
        description: Variable value overrides, as a map from quantity to value. Only applicable to quantity-specific variables.
        additionalProperties:
          description: Value that should override the calculated value for a particular quantity.
          oneOf:
          - type: string
          - type: number
          - type: boolean
      example: '{''1'': 2, ''5'': 1.5, ''10'': 1}'
    QuoteLinePricingItem:
      type: object
      description: A pricing item on the root component of a QuoteLine
      properties:
        uuid:
          type: string
          description: The UUID of the pricing item.
          example: f0f5bd9d-62a1-4e59-bc0e-4dbaa55d1ef9
        category:
          type: string
          enum:
          - general
          - purchased_component
          - material
          - outside
          - inside
        calculation_type:
          type: string
          enum:
          - markup
          - margin
        name:
          type: string
          description: The name of the pricing item.
        notes:
          type:
          - string
          - 'null'
        costing_variables:
          type: array
          items:
            $ref: '#/components/schemas/QuoteCostingVariable'
        custom_category_name:
          type:
          - string
          - 'null'
          example: CUSTOM MARKUP
        custom_category_color:
          type:
          - string
          - 'null'
          example: '#A51A54'
    QuoteComponent_2:
      type: object
      description: Represents a component in the quote item. In the simplest case, there is a single root component. If the quote item is an assembly, the array will contain each component in the assembly. Components can be manufactured (i.e., parts), assemblies (i.e., top-level or sub-assembly), or purchased (e.g., hardware). Exactly one component in the array will be the root component, but it might not be the first element in the array.
      properties:
        id:
          type: string
        add-ons:
          type: array
          items:
            $ref: '#/components/schemas/QuoteAddOn'
        quantities:
          type: array
          items:
            $ref: '#/components/schemas/QuoteQuantity_2'
        child_ids:
          type: array
          items:
            type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/ComponentChild'
        description:
          type:
          - string
          - 'null'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/QuoteDiscount'
        export_controlled:
          type: boolean
          description: Whether or not this component contains data that is export controlled (ITAR) by the US Government.
        finishes:
          type: array
          items:
            type: string
          description: 'Note: this field is deprecated. Finishes now show up as Operations.'
        innate_quantity:
          type: integer
          description: The quantity of this subcomponent that must be produced to make one top-level component.
        is_assembly:
          type: boolean
          description: Indicates if the component is an assembly or not. Mirrors the assembly tag seen in the UI.
        is_root_component:
          type: boolean
        material:
          $ref: '#/components/schemas/OrderMaterial'
        material_operations:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOperation'
        obtain_method:
          type: string
          enum:
          - manufactured
          - purchased
          description: 'Whether the component will be manufactured in house or purchased externally. Note: all assemblies are currently considered manufactured components.'
        parent_ids:
          type: array
          items:
            type: integer
        part_name:
          type: string
        part_number:
          type:
          - string
          - 'null'
        part_url:
          type: string
          format: url
        part_uuid:
          type: string
        pricing_items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLinePricingItem'
        process:
          $ref: '#/components/schemas/OrderProcess'
        purchased_component:
          description: Reference to a purchased component object within the supplier account. Will be not null when type == 'purchased'
          $ref: '#/components/schemas/QuotePurchasedComponent'
        revision:
          type:
          - string
          - 'null'
        shop_operations:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOperation'
        supporting_files:
          type: array
          items:
            $ref: '#/components/schemas/OrderSupportingFile'
        thumbnail_url:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - assembled
          - manufactured
          - purchased
          description: 'Note: this field is deprecated. Use obtain_method and is_assembly instead.'
    QuoteLine:
